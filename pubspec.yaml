name: terebi
description: "Terebi — application desktop de suivi, planning et visionnage d'anime."
publish_to: 'none'
version: 0.1.0+1

environment:
  # Contrainte volontairement large pour rester compatible entre l'hôte (Dart 3.12)
  # et l'image Docker de CI (Dart 3.11). Voir Dockerfile.flutter-ci.
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (découplé, testable)
  flutter_riverpod: ^2.5.1

  # Persistance locale (source de vérité du suivi)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Lecteur vidéo encastré (libmpv)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Réseau (AniList GraphQL + Jikan REST)
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Tests de logique pure (via `dart test` — flutter_test/flutter_tester est bloqué par l'EDR)
  test: ^1.25.0

  # Génération de code drift
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/resolver/animesama_resolve.py
