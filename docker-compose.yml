services:
  # FlareSolverr - Bypass Cloudflare
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
    ports:
      - "8191:8191"

  # Backend API Node.js
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mydashboard-api
    restart: unless-stopped
    environment:
      - API_PORT=3001
      - SITE_EXTENSION=to
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
    ports:
      - "3001:3001"
    depends_on:
      - flaresolverr

  # Frontend React + Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mydashboard-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
